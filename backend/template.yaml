AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ShopAI - one Lambda behind an HTTP API, DynamoDB tables, an S3 bucket for product images, and the website on S3 + CloudFront.

Parameters:
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Extra frontend origin allowed by CORS, for local development. The CloudFront site URL is always allowed.
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Secret used to sign session tokens (any long random string).
  AzureOpenAiEndpoint:
    Type: String
    Default: ''
    Description: e.g. https://shopai-openai-6962.openai.azure.com (leave empty to disable the assistant).
  AzureOpenAiKey:
    Type: String
    NoEcho: true
    Default: ''
  AzureOpenAiDeployment:
    Type: String
    Default: gpt-4.1-mini
  CloudFrontEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: New AWS accounts must be verified by AWS Support before they can create CloudFront. Until then the site is served from S3 website hosting (HTTP only).

Conditions:
  UseCloudFront: !Equals [!Ref CloudFrontEnabled, 'true']
  NoCloudFront: !Not [!Condition UseCloudFront]

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: email, AttributeType: S }]
      KeySchema: [{ AttributeName: email, KeyType: HASH }]

  StoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-stores
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  ReturnsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-returns
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]

  # ponytail: product images are public-read under products/; switch to a private bucket + CloudFront if needed.
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref AllowedOrigin, !If [UseCloudFront, !Sub 'https://${SiteDistribution.DomainName}', !GetAtt SiteBucket.WebsiteURL]]
            AllowedHeaders: [content-type]
            MaxAge: 600

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${ImagesBucket.Arn}/products/*

  # --- Website (upload with `npm run deploy:web`) ---
  # With CloudFront: private bucket, HTTPS through CloudFront only.
  # Without (default until the account is verified): S3 website hosting, public-read, HTTP only.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: !If
        - UseCloudFront
        - !Ref AWS::NoValue
        - { BlockPublicAcls: true, IgnorePublicAcls: true, BlockPublicPolicy: false, RestrictPublicBuckets: false }
      WebsiteConfiguration: !If
        - UseCloudFront
        - !Ref AWS::NoValue
        # The app routes in the browser, so unknown paths fall back to index.html
        - { IndexDocument: index.html, ErrorDocument: index.html }

  SitePublicReadPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: NoCloudFront
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ShopAI website
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        # The app routes in the browser (/products, /orders/ORD-1 ...), so unknown paths serve index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: UseCloudFront
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin, !If [UseCloudFront, !Sub 'https://${SiteDistribution.DomainName}', !GetAtt SiteBucket.WebsiteURL]]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # ponytail: secrets are plain Lambda env vars; move them to Secrets Manager for a real deployment.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src/index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 25
      Environment:
        Variables:
          TABLE_PREFIX: !Ref AWS::StackName
          BUCKET_NAME: !Ref ImagesBucket
          JWT_SECRET: !Ref JwtSecret
          AZURE_OPENAI_ENDPOINT: !Ref AzureOpenAiEndpoint
          AZURE_OPENAI_API_KEY: !Ref AzureOpenAiKey
          AZURE_OPENAI_DEPLOYMENT: !Ref AzureOpenAiDeployment
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref StoresTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ProductsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref OrdersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ReturnsTable }
        - S3WritePolicy: { BucketName: !Ref ImagesBucket }
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Put this in the frontend .env.local as VITE_API_BASE_URL
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  ImagesBucketName:
    Value: !Ref ImagesBucket
  SiteUrl:
    Description: The hosted website
    Value: !If [UseCloudFront, !Sub 'https://${SiteDistribution.DomainName}', !GetAtt SiteBucket.WebsiteURL]
  SiteBucketName:
    Value: !Ref SiteBucket
  SiteDistributionId:
    Condition: UseCloudFront
    Value: !Ref SiteDistribution
